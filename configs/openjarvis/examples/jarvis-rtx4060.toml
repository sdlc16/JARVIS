# JARVIS — config real para esta máquina (i5-12400F, 32GB RAM, RTX 4060 8GB)
# Copiar a ~/.openjarvis/config.toml dentro de WSL2 (ya generado ahí por
# `jarvis init --engine ollama`; este archivo es la versión de referencia
# comentada y versionada en el repo, per DEVELOPMENT_TASKS.md T1.2).
#
# Modelo por defecto fijado con datos reales de `jarvis bench run`
# (ver results/ y JARVIS_PROGRESS.md), nunca por lectura del catálogo:
# ver CLAUDE.md "VRAM y modelos -- no asumir, medir".
#
#   qwen3.5:2b     ~76-84 tok/s, ~4.3GB VRAM, 100% GPU   -> rápido, para voz/latencia baja
#   qwen3:8b       ~45-58 tok/s, ~7.2GB VRAM, 100% GPU   -> mejor calidad, cabe entero en 8GB
#   glm-4.7-flash  ~15-27 tok/s, ~6.5GB cargado, 97% GPU/3% CPU -> descarga real de 19GB
#                  en disco (no 8GB como asumía el catálogo); no se recomienda por defecto
#   trinity-mini   no existe con ese tag exacto en el registro público de Ollama (pendiente)

[engine]
default = "ollama"

[engine.ollama]
# host = "http://localhost:11434"  # cambiar solo si Ollama corre en otra máquina

[intelligence]
default_model = "qwen3:8b"          # mejor calidad, 100% GPU, cabe en 8GB con margen
# default_model = "qwen3.5:2b"      # alternativa rápida para turnos de voz (<3s, T2.4)

[agent]
default_agent = "simple"

[tools]
enabled = ["code_interpreter", "web_search", "file_read", "shell_exec"]

[security]
profile = "personal"
